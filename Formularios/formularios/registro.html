<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="../css/form.css">
    <link href="https://fonts.cdnfonts.com/css/antique-book-cover" rel="stylesheet">
</head>

<body>
    <center>
        <div class="contenedor">
            <div class="formulario-header">
                <h1 class="formulario">Registrate</h1>
                <div class="equis"><img src="../media/vote-no.png" alt="" href="ingreso.html"></div>
            </div>
            <form method="post" action="../php/registrar.php">
                <div class="conjunto">
                    <div class="formu" data-help="Introduce tu nombre completo.">
                        <label for="name" class="text">Nombre: </label>
                        <input type="text" id="name" name="name" autocomplete="off" required>
                        <span class="ayuda">Introduce tu nombre completo.</span>
                    </div><br>
                    <div class="formu" data-help="Introduce tu número de celular.">
                        <label for="telefono">Número de Celular: </label>
                        <input type="tel" id="telefono" name="telefono" placeholder="ingrese número de celular"
                            maxlength="10" size="10" autocomplete="off" pattern="[0-9]*" title="Ingresar solo números."
                            required>
                        <span class="ayuda">Introduce tu número de celular.</span>
                    </div><br>
                    <div class="formu" data-help="Introduce tu correo electrónico.">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                            placeholder="Ej. usuario@ejemplo.com" size="25" required>
                        <span class="ayuda">Introduce tu correo electrónico.</span>
                    </div><br>

                    <div class="formu" data-help="Introduce tu direccion de domicilio.">
                        <label for="direccion">Direccion:</label>
                        <input type="" id="direccion" name="direccion" pattern="^[a-zA-Z0-9\s,.\-#]{5,100}$"
                            title="La direecion ingresada debe ser una direccion real." required>
                        <span class="ayuda">Introduce una direccion de domicilio.</span>
                    </div><br><br>

                    <div class="formu" data-help="Introduce una contraseña.">
                        <label for="contraseña">Password:</label>
                        <input type="password" id="contraseña" name="contraseña"
                            pattern="(?=.*\d)(?=.*[a-z]{2})(?=.*[A-Z]).{5,16}"
                            title="La contraseña debe tener mínimo 5 caracteres, máximo 16 caracteres, debe incluir mínimo una mayúscula, mínimo 2 minúsculas, números y caracteres especiales"
                            required>
                        <span class="ayuda">Introduce tu contraseña.</span>
                    </div><br>
                    <p><a class="mensaje"   href="../formularios/ingreso.html" target="_blank">¿Ya tienes cuenta?, Inicia Sesión</a></p>
                    <center><input type="submit" value="Enviar" name="register">
                        <input type="reset" value="Limpiar">
                    </center><br><br>
                </div>
            </form>
        </div>
    </center>
</body>

</html>
