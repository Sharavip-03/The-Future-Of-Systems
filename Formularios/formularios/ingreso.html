<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="../css/form.css">
    <link href="https://fonts.cdnfonts.com/css/antique-book-cover" rel="stylesheet">
</head>

<body>
    <center>
        <div class="contenedor1">
            <div class="formulario-header">
                <h1 class="formulario">Inicia Sesión</h1>
                <div class="equis"><img src="../media/vote-no.png" alt="" href="ingreso.html"></div>
            </div>
            <form method="post" action="../php/iniciar.php">
                <div class="conjunto">
                    <div class="formu" data-help="Introduce tu correo electrónico.">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                            placeholder="Ej. usuario@ejemplo.com" size="25" required>
                        <span class="ayuda">Introduce tu correo electrónico.</span>
                    </div>
                    <div class="formu" data-help="Introduce una contraseña.">
                        <label for="contraseña">Password:</label>
                        <input type="password" id="contraseña" name="contraseña"
                            pattern="(?=.*\d)(?=.*[a-z]{2})(?=.*[A-Z]).{5,16}"
                            title="La contraseña debe tener mínimo 5 caracteres, máximo 16 caracteres, debe incluir mínimo una mayúscula, mínimo 2 minúsculas, números y caracteres especiales"
                            required>
                        <span class="ayuda">Introduce una contraseña.</span>
                    </div><br>
                    <p><a class="mensaje" href="../formularios/registro.html" target="_blank">¿No tienes cuenta?,
                            Registrate</a></p>
                    <center><input type="submit" value="Enviar">
                        <input type="reset" value="Limpiar">
                    </center><br><br>
                </div>
            </form>
        </div>
    </center>
</body>

</html>
